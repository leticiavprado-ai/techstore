<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body> 
        <header>
    <h1>TechStore Soluçoes em tecnologia</h1>

    <nav class="menu-principal">
        <a href="#home">Início</a>
        <a href="#produtos">Produtos</a>
        <a href="#contato">Contato</a> 
    </nav> 
    <section id="produtos">
  <h2>Passo a Passo de Compra</h2>

  <ol>
    <li>Escolha o produto no catálogo</li>
    <li>Informe o endereço de entrega</li>
    <li>Realize o pagamento com segurança</li>
  </ol> 
<img src="https://www.catho.com.br/carreira-sucesso/wp-content/uploads/sites/3/2023/10/dia-da-tecnologia-da-informacao.jpg" alt="imagem de tecnologia">

</header>
    </header> 
    <section id="contato">
  <h2>Formulário de Contato</h2>

  <form>
    <div>
      <label for="nome" id="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>
    </div> 
    <section id="contato">
  
        <div>
      <label for="email" id="email">E-mail:</label>
      <input type="email" id="email" name="email" required>
    </div>
 
    <div>
      <label for="mensagem" id="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="2" required></textarea>
    </div>  

    <button type="submit" class="btn-destaque">Enviar</button>

  </form>
</section>
</body>
</html>
